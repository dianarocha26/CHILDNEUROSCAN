<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="200" cy="200" r="190" fill="#0ea5e9" stroke="#0284c7" stroke-width="2"/>

  <!-- Brain main shape -->
  <g transform="translate(200, 200)">
    <!-- Left hemisphere -->
    <path d="M -80 -20 Q -100 -50 -85 -80 Q -70 -95 -50 -85 Q -40 -70 -45 -40 Q -50 -10 -65 5 Z"
          fill="white" stroke="white" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Right hemisphere -->
    <path d="M 80 -20 Q 100 -50 85 -80 Q 70 -95 50 -85 Q 40 -70 45 -40 Q 50 -10 65 5 Z"
          fill="white" stroke="white" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Center/Main brain body -->
    <ellipse cx="0" cy="10" rx="55" ry="70" fill="white" stroke="white" stroke-width="2.5"/>

    <!-- Brain ridges/gyri (convolutions) -->
    <g stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -45 -30 Q -40 -50 -35 -30"/>
      <path d="M -15 -55 Q -10 -70 -5 -55"/>
      <path d="M 15 -60 Q 20 -75 25 -60"/>
      <path d="M 45 -35 Q 50 -50 55 -35"/>

      <path d="M -50 5 Q -45 25 -40 5"/>
      <path d="M -20 30 Q -15 50 -10 30"/>
      <path d="M 0 35 Q 5 55 10 35"/>
      <path d="M 25 30 Q 30 48 35 30"/>
      <path d="M 50 8 Q 55 25 60 8"/>
    </g>

    <!-- Brain stem -->
    <path d="M -15 75 L -10 130 Q 0 140 10 130 L 15 75"
          fill="white" stroke="white" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Cerebellum (small lobes at bottom) -->
    <ellipse cx="-25" cy="100" rx="12" ry="20" fill="white" stroke="white" stroke-width="2"/>
    <ellipse cx="25" cy="100" rx="12" ry="20" fill="white" stroke="white" stroke-width="2"/>

    <!-- Neural activity indicator (center dots) -->
    <circle cx="-20" cy="0" r="6" fill="#fbbf24" opacity="0.95"/>
    <circle cx="0" cy="15" r="7" fill="#fbbf24" opacity="0.95"/>
    <circle cx="20" cy="5" r="6" fill="#fbbf24" opacity="0.95"/>

    <!-- Glow effect for neural activity -->
    <circle cx="0" cy="15" r="12" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Text around circle (optional, for branding) -->
  <defs>
    <path id="circlePath" d="M 50, 200 A 150, 150 0 0, 1 350, 200" fill="none"/>
  </defs>

  <text font-family="Arial, sans-serif" font-size="28" font-weight="bold" letter-spacing="3" fill="#0284c7" opacity="0.8">
    <textPath href="#circlePath" startOffset="50%" text-anchor="middle">
      CHILDNEUROSCAN
    </textPath>
  </text>
</svg>
