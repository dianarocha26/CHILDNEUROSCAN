<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#0ea5e9" rx="40"/>

  <!-- Brain icon (simplified for small favicon) -->
  <g transform="translate(50, 50)">
    <!-- Left hemisphere -->
    <path d="M 20 30 Q 15 20 20 10 Q 25 5 30 8 Q 32 12 30 20 Q 28 28 25 30 Z" fill="white" stroke="white" stroke-width="1.5"/>

    <!-- Right hemisphere -->
    <path d="M 80 30 Q 85 20 80 10 Q 75 5 70 8 Q 68 12 70 20 Q 72 28 75 30 Z" fill="white" stroke="white" stroke-width="1.5"/>

    <!-- Center connection -->
    <ellipse cx="50" cy="35" rx="18" ry="20" fill="white" stroke="white" stroke-width="1.5"/>

    <!-- Brain ridges -->
    <path d="M 35 40 Q 40 35 45 40" stroke="white" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M 55 40 Q 60 35 65 40" stroke="white" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M 40 50 Q 45 48 50 50" stroke="white" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M 50 50 Q 55 48 60 50" stroke="white" stroke-width="1" fill="none" stroke-linecap="round"/>

    <!-- Brain stem -->
    <path d="M 48 55 Q 48 65 50 75 Q 52 65 52 55" fill="white" stroke="white" stroke-width="1.5"/>

    <!-- Center dot (neural activity indicator) -->
    <circle cx="50" cy="35" r="3" fill="#fbbf24" opacity="0.9"/>
  </g>
</svg>